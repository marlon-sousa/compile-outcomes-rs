[package]
name = "compile-outcomes"
description = "Compiles Rust snippets and reports what the compiler said about each one, without judging, for #[test], Gherkin or any test framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not `readme.workspace`: that names the root README, outside the package,
# beside this crate's own `README.md`, and cargo 1.97 warns about the two.
readme = "README.md"
keywords = ["compile-fail", "testing", "diagnostics", "proc-macro", "gherkin"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[dependencies]
cargo_metadata.workspace = true
delegate.workspace = true
derive_more.workspace = true
getset.workspace = true
strum.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
cucumber.workspace = true
futures.workspace = true
tempfile.workspace = true

[[test]]
name = "scenarios"
harness = false
